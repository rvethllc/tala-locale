[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tala-locale"
version = "0.2.0"
description = "Phone number and timezone → country, currency, and language inference. Extended locale data (symbols, formatting, VAT, RTL) for 55 countries. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "RVETH", email = "engineering@rveth.in"},
]
keywords = [
    "phone", "locale", "country", "currency", "language",
    "i18n", "internationalization", "localization", "inference",
    "E.164", "fintech", "saas", "onboarding", "geolocation",
    "iso-3166", "iso-4217", "iso-639",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Internationalization",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rvethllc/tala-locale"
Repository = "https://github.com/rvethllc/tala-locale"
Issues = "https://github.com/rvethllc/tala-locale/issues"
Changelog = "https://github.com/rvethllc/tala-locale/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4.0",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tala_locale = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
